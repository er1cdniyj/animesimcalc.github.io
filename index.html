<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime RPG Calculators</title>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #7e22ce;
      --primary-glow: #c084fc;
      --secondary: #06b6d4;
      --secondary-glow: #22d3ee;
      --accent: #f97316;
      --accent-glow: #fdba74;
      --bg-dark: #0f0f19;
      --bg-card: #1a1a2e;
      --bg-element: #252542;
      --border: #4c4c78;
      --text-main: #f0f0f0;
      --text-secondary: #a1a1aa;
      --success: #22c55e;
      --error: #ef4444;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Oxanium', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated Background */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.5;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 120s linear infinite;
    }
    
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 1000px 1000px; }
    }
    
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.15;
      animation: float linear infinite;
    }
    
    @keyframes float {
      to { transform: translateY(-100vh) translateX(20vw); }
    }
    
    /* Header & Navigation */
    .header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 1rem;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    
    .logo i {
      font-size: 1.8rem;
      color: white;
    }
    
    .title {
      font-size: 2.5rem;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(126, 34, 206, 0.3);
    }
    
    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      text-align: center;
      max-width: 600px;
      margin-bottom: 1.5rem;
    }
    
    .navbar {
      display: flex;
      background: var(--bg-card);
      padding: 0.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 1rem;
    }
    
    .nav-btn {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: 'Oxanium', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .nav-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      box-shadow: 0 0 15px rgba(126, 34, 206, 0.4);
    }
    
    .nav-btn:hover:not(.active) {
      background: rgba(126, 34, 206, 0.1);
      color: var(--primary-glow);
    }
    
    /* Main Container */
    .main-container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    
    @media (min-width: 992px) {
      .main-container {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    .calculator-container {
      background: linear-gradient(to bottom, rgba(26, 26, 46, 0.9), rgba(26, 26, 46, 0.7));
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    
    .calculator-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }
    
    .calculator-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--primary-glow);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .calculator-subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    
    /* Form Elements */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    
    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .form-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    
    .form-input, .form-select {
      background: var(--bg-element);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-size: 1rem;
      font-family: 'Oxanium', sans-serif;
      transition: all 0.3s ease;
    }
    
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.3);
    }
    
    .checkbox-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      cursor: pointer;
    }
    
    .checkbox-input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }
    
    /* Sections */
    .section {
      background: rgba(37, 37, 66, 0.5);
      padding: 1.25rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(76, 76, 120, 0.3);
    }
    
    .section-title {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    /* Buttons */
    .btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.875rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      font-family: 'Oxanium', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
    }
    
    .btn-secondary {
      background: var(--bg-element);
      color: var(--text-main);
    }
    
    .btn-secondary:hover {
      box-shadow: 0 8px 20px rgba(76, 76, 120, 0.3);
    }
    
    /* Profile Controls */
    .profile-controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    
    .profile-input {
      flex-grow: 1;
      background: var(--bg-element);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      color: var(--text-main);
      font-family: 'Oxanium', sans-serif;
    }
    
    .profile-btn {
      background: var(--bg-element);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      font-family: 'Oxanium', sans-serif;
    }
    
    .profile-btn:hover {
      background: var(--primary);
      color: white;
    }
    
    /* Results */
    .result {
      margin-top: 2rem;
      background: rgba(37, 37, 66, 0.7);
      padding: 1.5rem;
      border-radius: 0.75rem;
      border-left: 4px solid var(--primary);
    }
    
    .result-item {
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .result-label {
      color: var(--text-secondary);
    }
    
    .result-value {
      font-weight: 600;
      color: var(--primary-glow);
    }
    
    /* Tooltips */
    .tooltip {
      position: relative;
      display: inline-block;
      width: 16px;
      height: 16px;
      background: var(--primary);
      color: var(--bg-dark);
      border-radius: 50%;
      text-align: center;
      font-size: 12px;
      line-height: 16px;
      cursor: help;
    }
    
    .tooltip .tooltiptext {
      visibility: hidden;
      width: 200px;
      background-color: var(--bg-element);
      color: var(--text-main);
      text-align: center;
      border-radius: 6px;
      padding: 8px;
      position: absolute;
      z-index: 1;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 0.8rem;
      border: 1px solid var(--border);
    }
    
    .tooltip:hover .tooltiptext {
      visibility: visible;
      opacity: 1;
    }
    
    /* Tabs */
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .calculator-container {
      animation: fadeIn 0.5s ease-out;
    }
  </style>
</head>
<body>
  
  <div class="bg-grid"></div>
  <div class="bg-particles" id="particles"></div>

  <div class="header">
    <div class="logo-container">
      <div class="logo">
        <i class="fas fa-calculator"></i>
      </div>
      <h1 class="title">Anime RPG Calculators</h1>
    </div>
    <p class="subtitle">Powerful calculators for your anime RPG gaming needs</p>
    
    <div class="navbar">
      <button class="nav-btn active" data-tab="stats-calc">
        <i class="fas fa-chart-line"></i> Stats Calculator
      </button>
      <button class="nav-btn" data-tab="coin-calc">
        <i class="fas fa-coins"></i> Coin Calculator
      </button>
      <button class="nav-btn" data-tab="goal-calc">
        <i class="fas fa-bullseye"></i> Goal Calculator
      </button>
    </div>
  </div>

  <div class="main-container">
    <!-- Stats Calculator -->
    <div class="tab-content active" id="stats-calc">
      <div class="calculator-container">
        <h2 class="calculator-title"><i class="fas fa-chart-line"></i> Stats Gain Calculator</h2>
        <p class="calculator-subtitle">Calculate your training gains</p>

        <div class="form-grid">
          <div class="form-group">
            <label for="statType" class="form-label">Training Type
              <div class="tooltip">?<span class="tooltiptext">Select the stat you're training (Strength, Energy, Defense, or Sword)</span></div>
            </label>
            <select id="statType" class="form-select">
              <option value="strength">Strength</option>
              <option value="energy">Energy</option>
              <option value="defense">Defense</option>
              <option value="sword">Sword</option>
            </select>
          </div>
          <div class="form-group">
            <label for="gainPerTick" class="form-label">Gain Per Tick
              <div class="tooltip">?<span class="tooltiptext">Amount gained each training tick (e.g. 1.5sx or 1e21)</span></div>
            </label>
            <input type="text" id="gainPerTick" class="form-input" placeholder="e.g. 1.5sx or 1e21" required>
          </div>
          <div class="form-group">
            <label for="time" class="form-label">Time (minutes)
              <div class="tooltip">?<span class="tooltiptext">Duration of your training session in minutes</span></div>
            </label>
            <input type="number" id="time" class="form-input" placeholder="e.g. 60" required>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title"><i class="fas fa-robot"></i> Companion Settings</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="companionActive" class="form-label">Companion Active
                <div class="tooltip">?<span class="tooltiptext">Toggle if you have an active companion</span></div>
              </label>
              <select id="companionActive" class="form-select">
                <option value="false">No</option>
                <option value="true">Yes</option>
              </select>
            </div>
            <div class="form-group">
              <label for="companionGain" class="form-label">Companion Gain Per Tick
                <div class="tooltip">?<span class="tooltiptext">Amount your companion gives per tick (e.g. 1.5qd or 1e15)</span></div>
              </label>
              <input type="text" id="companionGain" class="form-input" placeholder="e.g. 1.5qd or 1e15">
            </div>
          </div>
        </div>

        <div class="profile-controls">
          <input type="text" id="profileName" class="profile-input" placeholder="Profile name">
          <button class="profile-btn" id="saveProfileBtn"><i class="fas fa-save"></i> Save</button>
          <button class="profile-btn" id="loadProfileBtn"><i class="fas fa-folder-open"></i> Load</button>
        </div>

        <button class="btn" id="calculateBtn"><i class="fas fa-calculator"></i> Calculate Gains</button>
        
        <div class="result" id="result"></div>
      </div>
    </div>

    <!-- Coin Calculator -->
    <div class="tab-content" id="coin-calc">
      <div class="calculator-container">
        <h2 class="calculator-title"><i class="fas fa-coins"></i> Coin Calculator</h2>
        <p class="calculator-subtitle">Calculate your coin earnings based on rank and bonuses</p>

        <div class="form-grid">
          <div class="form-group">
            <label for="rankSelect" class="form-label">Select Rank</label>
            <select id="rankSelect" class="form-select">
              <option value="0">Rookie</option>
              <option value="1">Ninja</option>
              <option value="2">Pirate</option>
              <option value="3">Ghoul</option>
              <option value="4">Hero</option>
              <option value="5">Reaper</option>
              <option value="6">Warrior</option>
              <option value="7">Sin</option>
              <option value="8">Mage</option>
              <option value="9">Demon</option>
              <option value="10">Emperor</option>
              <option value="11">Elder</option>
              <option value="12">Overlord</option>
              <option value="13">Leader</option>
              <option value="14">Deity</option>
              <option value="15">Sage</option>
              <option value="16">Mask</option>
              <option value="17">Shinigami</option>
              <option value="18">Hashira</option>
              <option value="19">Destroyer</option>
              <option value="20">Otsutsuki</option>
              <option value="21">Pirate King</option>
            </select>
          </div>
          <div class="form-group">
            <label for="coinTimeInput" class="form-label">Time (minutes)
              <div class="tooltip">?<span class="tooltiptext">Duration of coin earning in minutes</span></div>
            </label>
            <input type="number" id="coinTimeInput" class="form-input" placeholder="e.g. 60" required>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title"><i class="fas fa-gem"></i> Bonuses</h3>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="doubleCoins" class="checkbox-input">
              2x Coins Gamepass
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="goldCompanion" class="checkbox-input">
              Gold Companion (+20%)
            </label>
          </div>
        </div>

        <button class="btn" id="calculateCoinsBtn"><i class="fas fa-coins"></i> Calculate Earnings</button>
        
        <div class="result" id="coinResult"></div>
      </div>
    </div>

    <!-- Goal Calculator -->
    <div class="tab-content" id="goal-calc">
      <div class="calculator-container">
        <h2 class="calculator-title"><i class="fas fa-bullseye"></i> Goal Calculator</h2>
        <p class="calculator-subtitle">Calculate time to reach your target</p>

        <div class="form-grid">
          <div class="form-group">
            <label for="goalStatType" class="form-label">Training Type
              <div class="tooltip">?<span class="tooltiptext">Select the stat you're training (Strength, Energy, Defense, or Sword)</span></div>
            </label>
            <select id="goalStatType" class="form-select">
              <option value="strength">Strength</option>
              <option value="energy">Energy</option>
              <option value="defense">Defense</option>
              <option value="sword">Sword</option>
            </select>
          </div>
          <div class="form-group">
            <label for="goalGainPerTick" class="form-label">Your Gain Per Tick
              <div class="tooltip">?<span class="tooltiptext">Amount you gain each training tick (e.g. 1.5sx or 1e21)</span></div>
            </label>
            <input type="text" id="goalGainPerTick" class="form-input" placeholder="e.g. 1.5sx or 1e21">
          </div>
          <div class="form-group">
            <label for="goalCompanionGain" class="form-label">Companion Gain Per Tick
              <div class="tooltip">?<span class="tooltiptext">Amount your companion gives per tick (e.g. 1.5qd or 1e15)</span></div>
            </label>
            <input type="text" id="goalCompanionGain" class="form-input" placeholder="e.g. 1.5qd or 1e15">
          </div>
          <div class="form-group">
            <label for="currentStat" class="form-label">Current Stat Value
              <div class="tooltip">?<span class="tooltiptext">Your current stat value (e.g. 1.5sx or 1e21)</span></div>
            </label>
            <input type="text" id="currentStat" class="form-input" placeholder="e.g. 1.5sx or 1e21">
          </div>
          <div class="form-group">
            <label for="desiredStat" class="form-label">Desired Stat Value
              <div class="tooltip">?<span class="tooltiptext">Your target stat value (e.g. 2.5sx or 2.5e21)</span></div>
            </label>
            <input type="text" id="desiredStat" class="form-input" placeholder="e.g. 2.5sx or 2.5e21">
          </div>
        </div>

        <div class="profile-controls">
          <input type="text" id="goalProfileName" class="profile-input" placeholder="Profile name">
          <button class="profile-btn" id="saveGoalProfileBtn"><i class="fas fa-save"></i> Save</button>
          <button class="profile-btn" id="loadGoalProfileBtn"><i class="fas fa-folder-open"></i> Load</button>
        </div>

        <button class="btn" id="calculateGoalBtn"><i class="fas fa-bullseye"></i> Calculate Time Needed</button>
        
        <div class="result" id="goalResult"></div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      
      function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = Math.floor(window.innerWidth / 10);
        
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.classList.add('particle');
          
          const size = Math.random() * 5 + 1;
          const posX = Math.random() * window.innerWidth;
          const posY = Math.random() * window.innerHeight;
          const duration = Math.random() * 30 + 20;
          const delay = Math.random() * 5;
          
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          particle.style.left = `${posX}px`;
          particle.style.top = `${posY}px`;
          particle.style.animationDuration = `${duration}s`;
          particle.style.animationDelay = `${delay}s`;
          
          particlesContainer.appendChild(particle);
        }
      }
      
      createParticles();

      // Tab functionality
      const tabButtons = document.querySelectorAll('.nav-btn');
      const tabContents = document.querySelectorAll('.tab-content');
      
      tabButtons.forEach(button => {
        button.addEventListener('click', () => {
          const tabId = button.getAttribute('data-tab');
          
          // Update active button
          tabButtons.forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          
          // Show active tab
          tabContents.forEach(content => content.classList.remove('active'));
          document.getElementById(tabId).classList.add('active');
        });
      });

      // Stats Calculator Variables
      const ticksPerMinute = {
        strength: 55,
        energy: 28,
        defense: 36,
        sword: 55
      };
      const companionTicksPerMinute = 10;

      // Coin Calculator Variables
      const ranks = [
        { name: "Rookie", coinPerMinute: 5 },
        { name: "Ninja", coinPerMinute: 10 },
        { name: "Pirate", coinPerMinute: 25 },
        { name: "Ghoul", coinPerMinute: 50 },
        { name: "Hero", coinPerMinute: 100 },
        { name: "Reaper", coinPerMinute: 250 },
        { name: "Warrior", coinPerMinute: 500 },
        { name: "Sin", coinPerMinute: 1000 },
        { name: "Mage", coinPerMinute: 5000 },
        { name: "Demon", coinPerMinute: 10000 },
        { name: "Emperor", coinPerMinute: 50000 },
        { name: "Elder", coinPerMinute: 100000 },
        { name: "Overlord", coinPerMinute: 500000 },
        { name: "Leader", coinPerMinute: 1000000 },
        { name: "Deity", coinPerMinute: 5000000 },
        { name: "Sage", coinPerMinute: 10000000 },
        { name: "Mask", coinPerMinute: 50000000 },
        { name: "Shinigami", coinPerMinute: 100000000 },
        { name: "Hashira", coinPerMinute: 500000000 },
        { name: "Destroyer", coinPerMinute: 1000000000 },
        { name: "Otsutsuki", coinPerMinute: 5000000000 },
        { name: "Pirate King", coinPerMinute: 10000000000 }
      ];

      // Utility Functions
      function parseNumberWithSuffix(input) {
        if (!input) return NaN;
        if (/^[0-9.]+e[0-9]+$/i.test(input)) return parseFloat(input);
        input = input.toString().trim().toLowerCase();
        const suffixes = {
          'k':1e3,'m':1e6,'b':1e9,'t':1e12,'qd':1e15,'qn':1e18,
          'sx':1e21,'sp':1e24,'oc':1e27,'no':1e30,'dc':1e33
        };
        let suffix = '';
        let numberPart = input;
        for (const s in suffixes) {
          if (input.endsWith(s)) {
            suffix = s;
            numberPart = input.substring(0, input.length - s.length);
            break;
          }
        }
        const number = parseFloat(numberPart);
        return isNaN(number) ? NaN : suffix ? number * suffixes[suffix] : number;
      }

      function abbreviateNumber(num) {
        const units = [
          {v:1e33,s:"Dc"},{v:1e30,s:"No"},{v:1e27,s:"Oc"},{v:1e24,s:"Sp"},
          {v:1e21,s:"Sx"},{v:1e18,s:"Qn"},{v:1e15,s:"Qd"},{v:1e12,s:"T"},
          {v:1e9,s:"B"},{v:1e6,s:"M"},{v:1e3,s:"K"}
        ];
        for (const {v,s} of units) if (num >= v) return (num/v).toFixed(2)+s;
        return num.toString();
      }

      function formatTime(minutes) {
        if (minutes < 60) return `${minutes.toFixed(1)} minutes`;
        const hours = minutes / 60;
        if (hours < 24) return `${hours.toFixed(1)} hours`;
        const days = hours / 24;
        return `${days.toFixed(1)} days`;
      }

      // Stats Calculator Function
      function calculateGains() {
        const statType = document.getElementById("statType").value;
        const gainPerTick = parseNumberWithSuffix(document.getElementById("gainPerTick").value);
        const time = parseFloat(document.getElementById("time").value);
        const hasCompanion = document.getElementById("companionActive").value === "true";
        const companionGain = hasCompanion ? parseNumberWithSuffix(document.getElementById("companionGain").value) : 0;

        if (isNaN(gainPerTick)) {
          document.getElementById("result").innerHTML = `<div class="result-item" style="color:var(--error)">Please enter a valid gain per tick</div>`;
          return;
        }

        if (isNaN(time) || time <= 0) {
          document.getElementById("result").innerHTML = `<div class="result-item" style="color:var(--error)">Please enter a valid time</div>`;
          return;
        }

        if (hasCompanion && isNaN(companionGain)) {
          document.getElementById("result").innerHTML = `<div class="result-item" style="color:var(--error)">Please enter valid companion gains</div>`;
          return;
        }

        const ticks = ticksPerMinute[statType] * time;
        const mainGain = gainPerTick * ticks;
        
        let companionTotalGain = 0;
        if (hasCompanion) {
          const companionTicks = companionTicksPerMinute * time;
          companionTotalGain = companionGain * companionTicks;
        }

        const totalGain = mainGain + companionTotalGain;

        document.getElementById("result").innerHTML = `
          <div class="result-item">
            <span class="result-label">Training Type:</span>
            <span class="result-value">${statType.charAt(0).toUpperCase()+statType.slice(1)}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Ticks Per Minute:</span>
            <span class="result-value">${ticksPerMinute[statType]}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Total Ticks:</span>
            <span class="result-value">${ticks}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Main Gain:</span>
            <span class="result-value">${abbreviateNumber(mainGain)}</span>
          </div>
          ${hasCompanion ? `
          <div class="result-item">
            <span class="result-label">Companion Ticks:</span>
            <span class="result-value">${companionTicksPerMinute * time}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Companion Gain:</span>
            <span class="result-value">${abbreviateNumber(companionTotalGain)}</span>
          </div>` : ''}
          <div class="result-item" style="margin-top:1rem;padding-top:0.75rem;border-top:1px solid var(--border)">
            <span class="result-label" style="font-weight:700">Total Gain:</span>
            <span class="result-value" style="font-weight:700">${abbreviateNumber(totalGain)}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Gain Per Minute:</span>
            <span class="result-value">${abbreviateNumber(totalGain / time)}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Gain Per Hour:</span>
            <span class="result-value">${abbreviateNumber(totalGain / time * 60)}</span>
          </div>
        `;
      }

      // Coin Calculator Function
      function calculateCoins() {
        const selectedRankIndex = parseInt(document.getElementById("rankSelect").value);
        const selectedRank = ranks[selectedRankIndex];
        const doubleCoins = document.getElementById("doubleCoins").checked;
        const goldCompanion = document.getElementById("goldCompanion").checked;
        const timeInput = document.getElementById("coinTimeInput").value;
        const time = parseInt(timeInput);

        if (!timeInput || isNaN(time) || time <= 0) {
          document.getElementById("coinResult").innerHTML = `
            <div class="result-item">
              <span style="color: var(--error);">Please enter a valid time</span>
            </div>
          `;
          return;
        }

        let coinsPerMinute = selectedRank.coinPerMinute;
        let bonuses = [];

        if (doubleCoins) {
          coinsPerMinute *= 2;
          bonuses.push("2x Gamepass");
        }

        if (goldCompanion) {
          coinsPerMinute *= 1.2;
          bonuses.push("Gold Companion");
        }

        const totalCoins = coinsPerMinute * time;
        const formattedCPM = abbreviateNumber(coinsPerMinute);
        const formattedTotal = abbreviateNumber(totalCoins);

        let resultHTML = `
          <div class="result-item">
            <span class="result-label">Rank:</span>
            <span class="result-value">${selectedRank.name}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Coins/Min:</span>
            <span class="result-value">${formattedCPM}</span>
          </div>
        `;

        if (bonuses.length > 0) {
          resultHTML += `
            <div class="result-item">
              <span class="result-label">Active Bonuses:</span>
              <span class="result-value">${bonuses.join(" + ")}</span>
            </div>
          `;
        }

        resultHTML += `
          <div class="result-item">
            <span class="result-label">Time:</span>
            <span class="result-value">${time} minutes</span>
          </div>
          <div class="result-item" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;">
            <span class="result-label" style="font-size: 1.1em;">Total Earnings:</span>
            <span class="result-value" style="font-size: 1.1em;">${formattedTotal}</span>
          </div>
        `;

        document.getElementById("coinResult").innerHTML = resultHTML;
      }

      // Goal Calculator Function
      function calculateTimeToGoal() {
        const statType = document.getElementById("goalStatType").value;
        const gainPerTick = parseNumberWithSuffix(document.getElementById("goalGainPerTick").value);
        const companionGain = parseNumberWithSuffix(document.getElementById("goalCompanionGain").value) || 0;
        const currentStat = parseNumberWithSuffix(document.getElementById("currentStat").value);
        const desiredStat = parseNumberWithSuffix(document.getElementById("desiredStat").value);

        if (isNaN(gainPerTick)) {
          document.getElementById("goalResult").innerHTML = `<div class="result-item" style="color:var(--error)">Please enter a valid gain per tick</div>`;
          return;
        }

        if (isNaN(currentStat)) {
          document.getElementById("goalResult").innerHTML = `<div class="result-item" style="color:var(--error)">Please enter your current stat value</div>`;
          return;
        }

        if (isNaN(desiredStat) || desiredStat <= currentStat) {
          document.getElementById("goalResult").innerHTML = `<div class="result-item" style="color:var(--error)">Please enter a valid desired stat higher than current</div>`;
          return;
        }

        const neededGain = desiredStat - currentStat;
        const gainPerMinute = (gainPerTick * ticksPerMinute[statType]) + (companionGain * companionTicksPerMinute);
        const minutesNeeded = neededGain / gainPerMinute;

        document.getElementById("goalResult").innerHTML = `
          <div class="result-item">
            <span class="result-label">Training Type:</span>
            <span class="result-value">${statType.charAt(0).toUpperCase()+statType.slice(1)}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Current Stat:</span>
            <span class="result-value">${abbreviateNumber(currentStat)}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Desired Stat:</span>
            <span class="result-value">${abbreviateNumber(desiredStat)}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Gain Needed:</span>
            <span class="result-value">${abbreviateNumber(neededGain)}</span>
          </div>
          <div class="result-item">
            <span class="result-label">Gain Per Minute:</span>
            <span class="result-value">${abbreviateNumber(gainPerMinute)}</span>
          </div>
          <div class="result-item" style="margin-top:1rem;padding-top:0.75rem;border-top:1px solid var(--border)">
            <span class="result-label" style="font-weight:700">Time Needed:</span>
            <span class="result-value" style="font-weight:700">${formatTime(minutesNeeded)}</span>
          </div>
          <div class="result-item">
            <span class="result-label">At This Rate You'll Reach It:</span>
            <span class="result-value">${new Date(Date.now() + minutesNeeded * 60000).toLocaleString()}</span>
          </div>
        `;
      }

      // Profile Management Functions
      function saveProfile() {
        const profileName = document.getElementById("profileName").value.trim();
        if (!profileName) {
          alert("Please enter a profile name");
          return;
        }
        
        const profile = {
          statType: document.getElementById("statType").value,
          gainPerTick: document.getElementById("gainPerTick").value,
          companionActive: document.getElementById("companionActive").value,
          companionGain: document.getElementById("companionGain").value,
          time: document.getElementById("time").value
        };
        
        localStorage.setItem(`trainingProfile_${profileName}`, JSON.stringify(profile));
        alert(`Profile "${profileName}" saved!`);
      }

      function loadProfile() {
        const profileName = document.getElementById("profileName").value.trim();
        if (!profileName) {
          alert("Please enter a profile name");
          return;
        }
        
        const savedProfile = localStorage.getItem(`trainingProfile_${profileName}`);
        if (!savedProfile) {
          alert(`Profile "${profileName}" not found!`);
          return;
        }
        
        try {
          const profile = JSON.parse(savedProfile);
          document.getElementById("statType").value = profile.statType;
          document.getElementById("gainPerTick").value = profile.gainPerTick;
          document.getElementById("companionActive").value = profile.companionActive;
          document.getElementById("companionGain").value = profile.companionGain || "";
          if (profile.time) document.getElementById("time").value = profile.time;
        } catch (e) {
          alert("Error loading profile");
          console.error(e);
        }
      }

      function saveGoalProfile() {
        const profileName = document.getElementById("goalProfileName").value.trim();
        if (!profileName) {
          alert("Please enter a profile name");
          return;
        }
        
        const profile = {
          statType: document.getElementById("goalStatType").value,
          gainPerTick: document.getElementById("goalGainPerTick").value,
          companionGain: document.getElementById("goalCompanionGain").value,
          currentStat: document.getElementById("currentStat").value,
          desiredStat: document.getElementById("desiredStat").value
        };
        
        localStorage.setItem(`goalProfile_${profileName}`, JSON.stringify(profile));
        alert(`Profile "${profileName}" saved!`);
      }

      function loadGoalProfile() {
        const profileName = document.getElementById("goalProfileName").value.trim();
        if (!profileName) {
          alert("Please enter a profile name");
          return;
        }
        
        const savedProfile = localStorage.getItem(`goalProfile_${profileName}`);
        if (!savedProfile) {
          alert(`Profile "${profileName}" not found!`);
          return;
        }
        
        try {
          const profile = JSON.parse(savedProfile);
          document.getElementById("goalStatType").value = profile.statType;
          document.getElementById("goalGainPerTick").value = profile.gainPerTick;
          document.getElementById("goalCompanionGain").value = profile.companionGain || "";
          document.getElementById("currentStat").value = profile.currentStat || "";
          document.getElementById("desiredStat").value = profile.desiredStat || "";
        } catch (e) {
          alert("Error loading profile");
          console.error(e);
        }
      }

      // Event Listeners
      document.getElementById("calculateBtn").addEventListener("click", calculateGains);
      document.getElementById("calculateCoinsBtn").addEventListener("click", calculateCoins);
      document.getElementById("calculateGoalBtn").addEventListener("click", calculateTimeToGoal);
      
      document.getElementById("saveProfileBtn").addEventListener("click", saveProfile);
      document.getElementById("loadProfileBtn").addEventListener("click", loadProfile);
      document.getElementById("saveGoalProfileBtn").addEventListener("click", saveGoalProfile);
      document.getElementById("loadGoalProfileBtn").addEventListener("click", loadGoalProfile);
      
      // Enter key support
      const inputs = [
        "gainPerTick", "time", "companionGain", 
        "goalGainPerTick", "goalCompanionGain", "currentStat", "desiredStat",
        "coinTimeInput"
      ];
      
      inputs.forEach(id => {
        document.getElementById(id).addEventListener("keypress", function(e) {
          if (e.key === "Enter") {
            if (id === "coinTimeInput") {
              calculateCoins();
            } else if (id === "gainPerTick" || id === "time" || id === "companionGain") {
              calculateGains();
            } else {
              calculateTimeToGoal();
            }
          }
        });
      });
    });
  </script>
</body>
</html>
